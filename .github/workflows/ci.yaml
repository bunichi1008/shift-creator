name: Verify
on: [push, pull_request]
permissions:
  contents: read

jobs:
  optimizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install './optimizer[test]'
      - run: python -m unittest discover -s optimizer/tests -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - working-directory: web
        run: go test -race ./...

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ./optimizer
      - run: PYTHON_BIN=python scripts/smoke.sh
      - run: PYTHON_BIN=python SMOKE_SOLVER=pulp scripts/smoke.sh
      - run: docker compose config --quiet
      - run: docker build -f web/Dockerfile .
      - run: docker build -f optimizer/Dockerfile .
